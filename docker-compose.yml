name: tarot-backend
services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////code/storage/readings.sqlite
    volumes:
      - ./storage:/code/storage
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
